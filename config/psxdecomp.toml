# config/psxdecomp.toml — adopted by /psxdecomp:upgrade (the repository predates psxdecomp).

[psxdecomp]
version = "0.6.0"
profile = "psx"
bootstrapped = "adopted 2026-10-04"

[pa3]
version = "3.14.2"
tag = "v3.14.2"
sha = "0ccf0dfaf95e36435ec1b7e58f3be3f863acb19b"

[refs]
file = "config/refs.toml"
index = "docs/ops/refs.md"

[deviations]
list = ["adopted: not bootstrapped by psxdecomp; pins recorded as found", "rule ids: the project rules G68 to G73 are in the range the kit keeps for itself (G68 to G100); kept by the developer's decision of 2026-10-12, no id collides today"]

[public]
repo = "anzaldoivan/dino-crisis-2-decomp"
dev_branch = "main"
checks = ["build SLUS_012.79", "public-clean audit (no game bytes)", "compile-only (pinned triple, no game bytes)"]
private_repo = "anzaldoivan/dino-crisis-2-decomp-private"
private_rev = "ae11967ceb453fd3ef6556b073a2d7d2e934befd"   # the -private commit CI reads
image = "ghcr.io/anzaldoivan/dino-crisis-2-decomp-toolchain@sha256:076b21e6df2c760ee31c4e60ad39e69e1a54aa26b8480724202fa447ace17c76"
land_check = ["bash", "tools/docker/land_check.sh", "{tree}"]
deny = ["config/waves.tsv", "config/journal.tsv", "config/routing.tsv", "config/usage.tsv"]   # agent ledgers
keyed = {"config/c_units.tsv" = 2}   # carve rows: alias, start

# [own]: what this repository holds itself in place of a psxdecomp delivery. psxdecomp writes nothing for a key
# set here; /psxdecomp:doctor checks that its path exists.
[own]
gate = "bash tools/docker/push_check.sh"  # the fleet check in the build container: the pre-push hook runs it on the host
toolchain = "config/toolchains.tsv"

# [floor]: the preprocess command of the build (the host's `cc -E` with the flags of the makefile), so the debt
# count reads the text that the compiler gets.
[floor]
cpp = "cc -E -undef -nostdinc -D__GNUC__=2 -Iinclude {file}"

# [kit]: psxdecomp's kit pin of 2026-09-30 (compat.toml). The kit's install record here names no commit.
[kit]
digest = "sha256:581f5ec0553b8c9119fca08ebb3b863caeb3bb2c1e5039402aa67f403ce6e748"
repo = "https://github.com/anzaldoivan/BFM-decomp.git"
sha = "898aeb324d557ae3c5c672ef08bdbbc3db080962"

# [psyq]: the PsyQ release the game links, from psxdecomp's psyq.toml (seen 2026-10-01). A lead for phase 1.4;
# the pin is phase 1.4's finding and lives in the repo's compiler-pin record.
[psyq]
stamp = "470"
version = "4.7"
ships_compiler = "no"
cc1_banner = ""
aspsx = ""
old_gcc = ""
confidence = "measured"
status = "lead — never the pin"

# [host]: the host recipe of the machine that builds (docs/ops/docker-host.md).
[host]
recipe = "macos-arm64"

# [delivered]: the sha256 of each owned file as psxdecomp last wrote it. A copy edited here since then is
# never overwritten unasked (`upgrade apply --take <action>`).
[delivered]
"tools/psxd_publish.py" = "ffc994a9f00ca10dae1d7c17b9057efbbe915d805d2a7f03975cedde428119bf"
".github/workflows/psxdecomp-readme.yml" = "e9d3f804fafd86930432b25af7c83f54f21fb81929750f5e84cec680585dfb35"
